# Dependency-update automation.
#
# Security fixes arrive as immediate, individual PRs via Dependabot *security updates* — a separate,
# event-driven flow that is NOT governed by the schedule below and is left ungrouped on purpose. (That flow
# must be enabled once in the repo settings: Settings -> Code security -> "Dependabot security updates".)
#
# Everything else is a *version update*: run weekly and collapsed into a single catch-all group per ecosystem,
# so routine bumps land as at most one PR per ecosystem per week (npm and GitHub Actions can't share a PR).
# npm majors are excluded from the group and arrive as individual PRs, so one incompatible major
# cannot block the whole routine batch.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # svelte-check (peer ^5 || ^6) and typescript-eslint (peer <6.1.0) do not accept
      # TypeScript 7 yet; every batch that includes it fails `npm ci` with ERESOLVE.
      # Remove once both peer ranges admit TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The formatter's version is the formatting rules: any prettier or
      # prettier-plugin-svelte bump can rewrap code, so upgrades are taken
      # deliberately rather than through routine dependency batches. See
      # CONTRIBUTING.md's "Formatter upgrades" section for the recipe.
      - dependency-name: "prettier"
      - dependency-name: "prettier-plugin-svelte"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
