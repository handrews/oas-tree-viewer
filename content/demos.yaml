self:
  label: Multi-document with $self (3.2)
  description: >-
    A four-document OAD using OAS 3.2 $self: each document self-identifies, so every
    cross-document reference resolves by identity regardless of where the files are served.
refs:
  label: Broken & external references (3.1)
  description: >-
    A two-document OAD that exercises every reference outcome (resolved, type-mismatch, broken, and
    external) to demonstrate the issue report and various warning and error indicators.
component-refs:
  label: Component-name references (3.2)
  description: >-
    Discriminators and Security Requirements resolving as component names
    (diamond, double line) or URI-references (asterisk, single line).
operation-refs:
  label: Operation references (3.2)
  description: >-
    operationRef pointing to unambiguous, ambiguous, webhook, and callback
    Operations.
operationid:
  label: operationId links (3.2)
  description: >-
    Link Objects resolving an Operation by operationId, including
    several warning or error cases.
fragment:
  label: Document fragments — Path Item & Schema (3.0)
  description: >-
    A 3.0 OAD split into fragmentary documents: pet-pathitem-3.0.yaml is a bare Path Item
    Object, typed based on the reference to its root.
fragment-interior:
  label: Document fragment — interior references (3.0)
  description: >-
    A reusable Components Object as a document fragment, which cannot be typed by a reference
    to its root, so each individual Object is separately typed based on references to it.
jsonschema:
  label: Standalone JSON Schema (2020-12)
  description: >-
    A single document whose root is a Schema Object, detected by lack of an openapi field
    and presence of $id and $schema.
dynamicref:
  label: $dynamicRef / $dynamicAnchor (3.1)
  description: >-
    JSON-Schema dynamic references including multiple possible resolutions at runtime.
dialects:
  label: Mixed Schema-Object dialects (3.1)
  description: >-
    Draft 2020-12 is supported, while draft-03 is not, meaning that the error of using
    $id (draft-03 used id) cannot be detected.
recursiveref:
  label: $recursiveRef / $recursiveAnchor (2019-09)
  description: >-
    draft-2019-09 recursive references.
numbered-drafts:
  label: draft-04/06/07 references (3.1)
  description: >-
    References using fragments in $id/id for named anchors in older JSON Schema drafts,
    with warnings for ignored adjacent keywords.
